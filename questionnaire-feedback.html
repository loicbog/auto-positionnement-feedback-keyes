<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NRB - Auto-positionnement sur le feedback</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-primary: #007CB8;
    --color-primary-dark: #005a87;
    --color-primary-light: #e6f3fa;
    --color-text: #2c3e50;
    --color-text-light: #5a6c7d;
    --color-bg: #f5f7fa;
    --color-card: #ffffff;
    --color-border: #e1e8ed;
    --color-success: #27ae60;
    --color-warning: #f39c12;
    --color-danger: #e74c3c;
    --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
    --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
    --radius: 8px;
    --radius-lg: 12px;
    --transition: 0.2s ease-in-out;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }

  .container {
    width: 100%;
    max-width: 720px;
    background: var(--color-card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    overflow: hidden;
    margin: 0 auto;
  }

  /* ===== HEADER ===== */
  .header {
    background: #1B2D51;
    color: white;
    padding: 44px 32px 24px;
    display: flex;
    align-items: center;
    gap: 24px;
    position: relative;
  }

  .lang-selector {
    position: absolute;
    top: 16px;
    right: 16px;
    display: flex;
    gap: 4px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 6px;
    padding: 3px;
    border: 1px solid rgba(255, 255, 255, 0.25);
  }

  .lang-btn {
    background: transparent;
    border: none;
    color: rgba(255, 255, 255, 0.85);
    font-family: inherit;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: all 0.18s ease-in-out;
  }

  .lang-btn:hover { background: rgba(255, 255, 255, 0.15); color: white; }
  .lang-btn.active { background: white; color: var(--color-primary-dark); }

  .header-logo {
    flex-shrink: 0;
    width: 80px;
    height: auto;
    border-radius: 6px;
  }

  .header-text { flex: 1; min-width: 0; }
  .header h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 8px; }
  .header p { font-size: 1rem; opacity: 0.95; }

  /* ===== PROGRESS ===== */
  .progress-wrapper {
    padding: 16px 32px;
    background: var(--color-primary-light);
    border-bottom: 1px solid var(--color-border);
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.875rem;
    color: var(--color-text-light);
    margin-bottom: 8px;
  }

  .progress-info strong { color: var(--color-primary); }

  .progress-bar {
    height: 6px;
    background: rgba(0, 124, 184, 0.15);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--color-primary);
    border-radius: 3px;
    transition: width 0.3s ease-in-out;
  }

  .dimension-label {
    display: inline-block;
    padding: 2px 10px;
    background: var(--color-primary);
    color: white;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 600;
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* ===== CONTENT ===== */
  .content { padding: 32px; }

  .screen { display: none; animation: fadeIn 0.4s ease-in-out; }
  .screen.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== INTRO ===== */
  .intro-list { list-style: none; margin: 24px 0; }

  .intro-list li {
    padding: 12px 16px;
    background: var(--color-primary-light);
    border-left: 3px solid var(--color-primary);
    border-radius: 6px;
    margin-bottom: 10px;
    color: var(--color-text);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .intro-list li::before {
    content: "✓";
    color: var(--color-primary);
    font-weight: 700;
    font-size: 1.1rem;
  }

  .intro-meta { display: flex; gap: 16px; margin: 20px 0; flex-wrap: wrap; }

  .meta-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: var(--color-bg);
    border-radius: 20px;
    font-size: 0.875rem;
    color: var(--color-text-light);
    font-weight: 500;
  }

  /* ===== QUESTION ===== */
  .question-title {
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--color-text);
    margin: 16px 0 20px;
    line-height: 1.4;
  }

  .question-helper {
    font-size: 0.875rem;
    color: var(--color-text-light);
    font-style: italic;
    margin-bottom: 16px;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }

  .option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    background: var(--color-card);
    border: 2px solid var(--color-border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: all var(--transition);
    font-size: 0.95rem;
    color: var(--color-text);
  }

  .option:hover { border-color: var(--color-primary); background: var(--color-primary-light); }

  .option input[type="radio"],
  .option input[type="checkbox"] {
    accent-color: var(--color-primary);
    width: 18px;
    height: 18px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .option.selected {
    border-color: var(--color-primary);
    background: var(--color-primary-light);
    font-weight: 500;
  }

  /* ===== BUTTONS ===== */
  .actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid var(--color-border);
    gap: 12px;
  }

  .actions.center { justify-content: center; }

  .btn {
    padding: 12px 28px;
    border: none;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .btn-primary { background: var(--color-primary); color: white; }

  .btn-primary:hover:not(:disabled) {
    background: var(--color-primary-dark);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }

  .btn-primary:disabled { background: #b0bec5; cursor: not-allowed; }

  .btn-secondary {
    background: transparent;
    color: var(--color-primary);
    border: 2px solid var(--color-primary);
  }

  .btn-secondary:hover { background: var(--color-primary-light); }

  .btn-ghost { background: transparent; color: var(--color-text-light); }
  .btn-ghost:hover { color: var(--color-primary); }

  /* ===== RESULTS ===== */
  .global-score-section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
    align-items: center;
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: 32px;
    margin-bottom: 32px;
    box-shadow: var(--shadow-sm);
  }

  .global-score-text h2 {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--color-text);
    line-height: 1.3;
    margin-bottom: 16px;
  }

  .global-score-text .intro-text {
    color: var(--color-text-light);
    font-size: 0.95rem;
    margin-bottom: 16px;
  }

  .global-score-text .intro-list { margin: 0; }

  .global-score-text .intro-list li {
    background: transparent;
    border-left: none;
    padding: 6px 0;
    margin: 0;
    font-size: 0.95rem;
  }

  .global-score-gauge {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .global-score-gauge svg { width: 100%; max-width: 280px; height: auto; }

  .gauge-label {
    color: var(--color-primary);
    font-weight: 700;
    font-size: 1rem;
    margin-top: 4px;
    text-align: center;
  }

  .global-score-message {
    margin-top: 12px;
    font-size: 0.875rem;
    color: var(--color-text-light);
    line-height: 1.5;
    text-align: center;
    font-style: italic;
  }

  .details-heading {
    font-size: 1.1rem;
    color: var(--color-text);
    margin-bottom: 16px;
  }

  .dimensions-results {
    display: flex;
    flex-direction: column;
    gap: 24px;
    margin-bottom: 24px;
  }

  .dimension-card {
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow-sm);
  }

  .dimension-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .dimension-title {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--color-text);
  }

  .dimension-score { display: flex; align-items: baseline; gap: 6px; }

  .dimension-score-value {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--color-primary);
  }

  .dimension-score-max { font-size: 0.875rem; color: var(--color-text-light); }

  .dimension-progress-bar {
    height: 8px;
    background: var(--color-bg);
    border-radius: 4px;
    overflow: hidden;
    margin: 12px 0 16px;
  }

  .dimension-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
    border-radius: 4px;
    transition: width 0.6s ease-in-out;
  }

  .level-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 0.8rem;
    font-weight: 600;
    margin-bottom: 12px;
  }

  .level-1 { background: #ffeaa7; color: #8a6914; }
  .level-2 { background: #b3e0ff; color: #004a73; }
  .level-3 { background: #c8e6c9; color: #1e6b30; }

  .dimension-description {
    color: var(--color-text);
    line-height: 1.6;
    font-size: 0.95rem;
  }

  .info-note {
    background: var(--color-primary-light);
    border-left: 3px solid var(--color-primary);
    padding: 16px 20px;
    border-radius: 6px;
    margin: 24px 0;
    font-size: 0.9rem;
    color: var(--color-text);
  }

  .info-note strong {
    color: var(--color-primary-dark);
    display: block;
    margin-bottom: 4px;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 600px) {
    body { padding: 0; }
    .container { border-radius: 0; min-height: 100vh; }
    .header { padding: 40px 20px 20px; gap: 16px; }
    .header-logo { width: 56px; }
    .lang-selector { top: 10px; right: 10px; }
    .lang-btn { font-size: 0.7rem; padding: 4px 8px; }
    .content, .progress-wrapper { padding-left: 20px; padding-right: 20px; }
    .header h1 { font-size: 1.25rem; }
    .header p { font-size: 0.9rem; }
    .question-title { font-size: 1.1rem; }
    .actions { flex-wrap: wrap; }
    .btn { flex: 1; justify-content: center; padding: 12px 16px; }
    .global-score-section { grid-template-columns: 1fr; gap: 16px; padding: 20px; }
    .global-score-text h2 { font-size: 1.15rem; }
    .global-score-gauge svg { max-width: 220px; }
  }
</style>
</head>

const SUPPORTED_LANGS = ["fr", "en", "nl"];
const DEFAULT_LANG = "en"; // Fallback si la langue navigateur n'est ni fr/nl
const LANG_STORAGE_KEY = "feedback_lang";
const STATE_STORAGE_KEY = "feedback_state_v2";

/* ============================================================
   STATE
   ============================================================ */
const state = {
  lang: DEFAULT_LANG,
  answers: new Array(I18N.questions.length).fill(null),
  currentIndex: 0
};

/* ============================================================
   LANG MANAGEMENT
   ============================================================ */
function detectLanguage() {
  // 1. localStorage (choix utilisateur précédent)
  try {
    const stored = localStorage.getItem(LANG_STORAGE_KEY);
    if (stored && SUPPORTED_LANGS.includes(stored)) return stored;
  } catch (e) {}

  // 2. Détection navigateur
  const nav = (navigator.language || navigator.userLanguage || "").toLowerCase();
  if (nav.startsWith("fr")) return "fr";
  if (nav.startsWith("nl")) return "nl";
  if (nav.startsWith("en")) return "en";

  // 3. Fallback
  return DEFAULT_LANG;
}

function setLanguage(lang) {
  if (!SUPPORTED_LANGS.includes(lang)) return;
  state.lang = lang;
  try { localStorage.setItem(LANG_STORAGE_KEY, lang); } catch (e) {}
  document.documentElement.lang = lang;
  applyTranslations();
  updateLangSelectors();
}

function updateLangSelectors() {
  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.lang === state.lang);
  });
}

function t(key) {
  const entry = I18N.ui[key];
  if (!entry) return "[" + key + "]";
  return entry[state.lang] || entry[DEFAULT_LANG] || "";
}

function applyTranslations() {
  // Tous les éléments avec data-i18n (textContent)
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    el.textContent = t(key);
  });
  // Tous les éléments avec data-i18n-html (innerHTML pour permettre <strong>)
  document.querySelectorAll("[data-i18n-html]").forEach(el => {
    const key = el.dataset.i18nHtml;
    el.innerHTML = t(key);
  });

  // Listes de dimensions (intro + résultats)
  const dimensionLists = [
    document.getElementById("intro-dimensions"),
    document.getElementById("results-dimensions")
  ];
  dimensionLists.forEach(ul => {
    if (!ul) return;
    ul.innerHTML = "";
    ["1", "2", "3"].forEach(dim => {
      const li = document.createElement("li");
      li.textContent = I18N.dimensions[dim].title[state.lang];
      ul.appendChild(li);
    });
  });

  // Bouton "Suivant" / "Voir mes résultats" selon position
  const btnNext = document.getElementById("btn-next");
  if (btnNext) {
    const isLast = state.currentIndex === I18N.questions.length - 1;
    btnNext.textContent = isLast ? t("btn_see_results") : t("btn_next");
  }

  // Si on est sur l'écran question, re-render pour traduire la question affichée
  const screenQuestion = document.getElementById("screen-question");
  if (screenQuestion && screenQuestion.classList.contains("active")) {
    renderQuestion(state.currentIndex);
  }

  // Si on est sur l'écran résultats, re-render pour traduire les cartes
  const screenResults = document.getElementById("screen-results");
  if (screenResults && screenResults.classList.contains("active")) {
    renderResultsContent();
  }
}

/* ============================================================
   PERSISTENCE
   ============================================================ */
function saveState() {
  // SCORM si disponible
  if (typeof SCORM !== "undefined" && SCORM.isAvailable && SCORM.isAvailable()) {
    SCORM.saveSuspendData(state);
  }
  try {
    localStorage.setItem(STATE_STORAGE_KEY, JSON.stringify(state));
  } catch (e) {}
}

function loadState() {
  if (typeof SCORM !== "undefined" && SCORM.isAvailable && SCORM.isAvailable()) {
    const scormData = SCORM.loadSuspendData();
    if (scormData && Array.isArray(scormData.answers) && scormData.answers.length === I18N.questions.length) {
      state.answers = scormData.answers;
      state.currentIndex = scormData.currentIndex || 0;
      return state.answers.some(a => a !== null);
    }
  }
  try {
    const raw = localStorage.getItem(STATE_STORAGE_KEY);
    if (!raw) return false;
    const parsed = JSON.parse(raw);
    if (parsed && Array.isArray(parsed.answers) && parsed.answers.length === I18N.questions.length) {
      state.answers = parsed.answers;
      state.currentIndex = parsed.currentIndex || 0;
      return state.answers.some(a => a !== null);
    }
  } catch (e) {}
  return false;
}

function clearState() {
  state.answers = new Array(I18N.questions.length).fill(null);
  state.currentIndex = 0;
  if (typeof SCORM !== "undefined" && SCORM.isAvailable && SCORM.isAvailable()) {
    SCORM.saveSuspendData(state);
  }
  try { localStorage.removeItem(STATE_STORAGE_KEY); } catch (e) {}
}

/* ============================================================
   DOM REFS
   ============================================================ */
const screenIntro = document.getElementById("screen-intro");
const screenQuestion = document.getElementById("screen-question");
const screenResults = document.getElementById("screen-results");

const btnStart = document.getElementById("btn-start");
const btnResume = document.getElementById("btn-resume");
const btnPrev = document.getElementById("btn-prev");
const btnNext = document.getElementById("btn-next");
const btnRestart = document.getElementById("btn-restart");

const qDimensionTitle = document.getElementById("q-dimension-title");
const qDimensionSubtitle = document.getElementById("q-dimension-subtitle");
const qPercent = document.getElementById("q-percent");
const qCompletedLabel = document.getElementById("q-completed-label");
const qDimProgress = document.getElementById("q-dim-progress");
const progressFill = document.getElementById("progress-fill");
const qHelper = document.getElementById("q-helper");
const qTitle = document.getElementById("q-title");
const qOptions = document.getElementById("q-options");

/* ============================================================
   NAVIGATION
   ============================================================ */
function showScreen(name) {
  [screenIntro, screenQuestion, screenResults].forEach(s => s.classList.remove("active"));
  if (name === "intro") screenIntro.classList.add("active");
  else if (name === "question") screenQuestion.classList.add("active");
  else if (name === "results") screenResults.classList.add("active");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderQuestion(index) {
  const q = I18N.questions[index];
  const lang = state.lang;
  const dim = I18N.dimensions[q.dimension];

  qDimensionTitle.textContent = dim.title[lang];
  qDimensionSubtitle.textContent = t("dimension_word") + " " + q.dimension + " " + t("of_three");

  const percent = Math.round(((index + 1) / I18N.questions.length) * 100);
  qPercent.textContent = percent + "%";
  qCompletedLabel.textContent = t("completed_label");
  qDimProgress.textContent = t("dimension_word") + " " + q.dimension + " - " + dim.short[lang];
  progressFill.style.width = percent + "%";

  // Helper : soit défini sur la question, soit "Plusieurs réponses possibles" pour les checkbox
  let helperText = "";
  if (q.helper) {
    helperText = q.helper[lang];
  } else if (q.type === "checkbox") {
    helperText = t("multiple_choice_helper");
  }
  qHelper.textContent = helperText;
  qHelper.style.display = helperText ? "block" : "none";

  qTitle.textContent = q.title[lang];

  qOptions.innerHTML = "";
  const currentAnswers = state.answers[index] || [];

  q.options.forEach((opt, optIdx) => {
    const label = document.createElement("label");
    label.className = "option";
    if (currentAnswers.includes(optIdx)) label.classList.add("selected");

    const input = document.createElement("input");
    input.type = q.type === "checkbox" ? "checkbox" : "radio";
    input.name = "q-" + index;
    input.value = optIdx;
    input.checked = currentAnswers.includes(optIdx);

    input.addEventListener("change", () => handleAnswerChange(index, optIdx, q.type));

    const span = document.createElement("span");
    span.textContent = opt.text[lang];

    label.appendChild(input);
    label.appendChild(span);
    qOptions.appendChild(label);
  });

  btnPrev.disabled = index === 0;
  btnPrev.style.visibility = index === 0 ? "hidden" : "visible";
  updateNextButton(index);
}

function handleAnswerChange(qIndex, optIdx, type) {
  if (type === "radio") {
    state.answers[qIndex] = [optIdx];
  } else {
    const current = state.answers[qIndex] || [];
    if (current.includes(optIdx)) {
      state.answers[qIndex] = current.filter(i => i !== optIdx);
    } else {
      state.answers[qIndex] = [...current, optIdx];
    }
  }

  document.querySelectorAll("#q-options .option").forEach((label, i) => {
    if ((state.answers[qIndex] || []).includes(i)) label.classList.add("selected");
    else label.classList.remove("selected");
  });

  updateNextButton(qIndex);
  saveState();
}

function updateNextButton(index) {
  const answer = state.answers[index];
  const isLast = index === I18N.questions.length - 1;
  const hasAnswer = Array.isArray(answer) && answer.length > 0;
  btnNext.disabled = !hasAnswer;
  btnNext.textContent = isLast ? t("btn_see_results") : t("btn_next");
}

btnStart.addEventListener("click", () => {
  state.currentIndex = 0;
  state.answers = new Array(I18N.questions.length).fill(null);
  saveState();
  showScreen("question");
  renderQuestion(0);
});

btnResume.addEventListener("click", () => {
  showScreen("question");
  renderQuestion(state.currentIndex);
});

btnPrev.addEventListener("click", () => {
  if (state.currentIndex > 0) {
    state.currentIndex--;
    saveState();
    renderQuestion(state.currentIndex);
  }
});

btnNext.addEventListener("click", () => {
  if (state.currentIndex < I18N.questions.length - 1) {
    state.currentIndex++;
    saveState();
    renderQuestion(state.currentIndex);
  } else {
    showResults();
  }
});

btnRestart.addEventListener("click", () => {
  clearState();
  showScreen("intro");
  btnResume.style.display = "none";
});

// Sélecteurs de langue (3 écrans)
document.querySelectorAll(".lang-btn").forEach(btn => {
  btn.addEventListener("click", () => setLanguage(btn.dataset.lang));
});

/* ============================================================
   CALCUL & AFFICHAGE DES RÉSULTATS
   ============================================================ */
function computeScores() {
  const dimensionScores = { 1: 0, 2: 0, 3: 0 };
  const dimensionMaxScores = { 1: 0, 2: 0, 3: 0 };
  const dimensionMinScores = { 1: 0, 2: 0, 3: 0 };

  I18N.questions.forEach((q, idx) => {
    const selected = state.answers[idx] || [];
    selected.forEach(optIdx => {
      dimensionScores[q.dimension] += q.options[optIdx].points;
    });

    if (q.type === "radio") {
      const points = q.options.map(o => o.points);
      dimensionMaxScores[q.dimension] += Math.max(...points);
      dimensionMinScores[q.dimension] += Math.min(...points);
    } else {
      q.options.forEach(o => {
        if (o.points > 0) dimensionMaxScores[q.dimension] += o.points;
        if (o.points < 0) dimensionMinScores[q.dimension] += o.points;
      });
    }
  });

  const globalScore = dimensionScores[1] + dimensionScores[2] + dimensionScores[3];
  const globalMax = dimensionMaxScores[1] + dimensionMaxScores[2] + dimensionMaxScores[3];
  const globalMin = dimensionMinScores[1] + dimensionMinScores[2] + dimensionMinScores[3];

  return {
    dimensions: dimensionScores,
    dimensionMax: dimensionMaxScores,
    dimensionMin: dimensionMinScores,
    global: globalScore,
    globalMax,
    globalMin
  };
}

function getLevelForDimension(dim, score) {
  const thresholds = I18N.levels[String(dim)];
  for (const t of thresholds) {
    if (score >= t.min && score <= t.max) return t;
  }
  if (score < thresholds[0].min) return thresholds[0];
  return thresholds[thresholds.length - 1];
}

function scoreToPercent(score, min, max) {
  if (max === min) return 0;
  const pct = ((score - min) / (max - min)) * 100;
  return Math.max(0, Math.min(100, Math.round(pct)));
}

function getGlobalMessage(percent) {
  if (percent >= 70) return t("global_msg_high");
  if (percent >= 40) return t("global_msg_mid");
  return t("global_msg_low");
}

// Re-render UNIQUEMENT le contenu dynamique des résultats (pas la jauge animée)
function renderResultsContent() {
  if (!state.lastScores) return;
  const scores = state.lastScores;
  const lang = state.lang;

  const globalPercent = scoreToPercent(scores.global, scores.globalMin, scores.globalMax);
  document.getElementById("global-score-message").textContent = getGlobalMessage(globalPercent);

  const container = document.getElementById("dimensions-results");
  container.innerHTML = "";

  [1, 2, 3].forEach(dim => {
    const score = scores.dimensions[dim];
    const min = scores.dimensionMin[dim];
    const max = scores.dimensionMax[dim];
    const percent = scoreToPercent(score, min, max);
    const level = getLevelForDimension(dim, score);
    const levelTitle = t("level_word") + " " + level.level;

    const card = document.createElement("div");
    card.className = "dimension-card";
    card.innerHTML =
      '<div class="dimension-header">' +
        '<div>' +
          '<span class="dimension-label">' + t("dimension_word") + ' ' + dim + '</span>' +
          '<div class="dimension-title" style="margin-top: 6px;">' + escapeHtml(I18N.dimensions[dim].title[lang]) + '</div>' +
        '</div>' +
        '<div class="dimension-score">' +
          '<span class="dimension-score-value">' + percent + '</span>' +
          '<span class="dimension-score-max">%</span>' +
        '</div>' +
      '</div>' +
      '<div class="dimension-progress-bar">' +
        '<div class="dimension-progress-fill" style="width: ' + percent + '%;"></div>' +
      '</div>' +
      '<span class="level-badge level-' + level.level + '">' + levelTitle + '</span>' +
      '<p class="dimension-description">' + escapeHtml(level.description[lang]) + '</p>';
    container.appendChild(card);
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function showResults() {
  const scores = computeScores();
  state.lastScores = scores;

  const globalPercent = scoreToPercent(scores.global, scores.globalMin, scores.globalMax);

  showScreen("results");
  renderResultsContent();
  animateGauge(globalPercent);

  if (typeof SCORM !== "undefined" && SCORM.isAvailable && SCORM.isAvailable()) {
    if (SCORM.setScore) SCORM.setScore(globalPercent, 100, 0);
    if (SCORM.setCompleted) SCORM.setCompleted();
  }
}

function animateGauge(targetPercent) {
  const arcLength = 251.3;
  const gaugeFill = document.getElementById("gauge-fill");
  const gaugeNeedle = document.getElementById("gauge-needle");
  const gaugeValue = document.getElementById("gauge-value");

  gaugeFill.style.transition = "none";
  gaugeFill.style.strokeDashoffset = arcLength;
  gaugeNeedle.setAttribute("transform", "rotate(-90 100 130)");
  gaugeValue.textContent = "0%";

  void gaugeFill.getBoundingClientRect();

  setTimeout(() => {
    gaugeFill.style.transition = "stroke-dashoffset 1.4s cubic-bezier(0.34, 1.2, 0.64, 1)";
    gaugeFill.style.strokeDashoffset = arcLength * (1 - targetPercent / 100);

    const angle = -90 + (targetPercent / 100) * 180;
    gaugeNeedle.setAttribute("transform", "rotate(" + angle + " 100 130)");

    const duration = 1400;
    const startTime = performance.now();
    function step(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      const currentValue = Math.round(targetPercent * eased);
      gaugeValue.textContent = currentValue + "%";
      if (progress < 1) requestAnimationFrame(step);
      else gaugeValue.textContent = targetPercent + "%";
    }
    requestAnimationFrame(step);
  }, 150);
}

/* ============================================================
   INIT
   ============================================================ */
function init() {
  if (typeof SCORM !== "undefined" && SCORM.init) SCORM.init();

  // Détecter et appliquer la langue
  state.lang = detectLanguage();

  // Charger l'état (réponses précédentes)
  const hasProgress = loadState();

  // Appliquer les traductions à l'UI
  setLanguage(state.lang);

  if (hasProgress) btnResume.style.display = "inline-flex";
}

init();
</script>
